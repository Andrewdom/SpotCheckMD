name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build first: it generates the Next.js route types that typecheck reads.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/medgemma/requirements-test.txt
      - run: pip install -r services/medgemma/requirements-test.txt
      # Fake generators only; no model weights, GPU, or tokens are used.
      - run: python -m pytest services/medgemma tests/test_scin_image_skip.py -q
